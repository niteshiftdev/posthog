services:
    # Postgres, Redis, Kafka, ClickHouse and object storage, the subset of the dev compose stack
    # the web app needs. Temporal, the Rust services and the Node ingestion consumers are left out.
    - name: infra
      command: |
          exec docker compose -p posthog -f docker-compose.dev.yml -f docker-compose.niteshift.yml \
              up db redis7 zookeeper kafka kafka-init clickhouse objectstorage
      stopGracePeriod: 90s

    - name: backend
      command: |
          export PATH="/opt/node/bin:$PWD/.venv/bin:$PATH"
          # .env.development and .env.services are the repo's committed dev defaults; bin/start
          # loads them this way for host-side processes.
          while IFS="=" read -r name value; do
              if [[ -n "$name" && "$name" != \#* && -z "${!name:-}" ]]; then
                  export "$name=$value"
              fi
          done < <(cat .env.development .env.services)
          # bin/start-backend otherwise binds the Docker bridge address, which localhost misses.
          export HOST_BIND=0.0.0.0
          # Emit same-origin Vite URLs, so the proxy serves the app and its modules as one origin.
          export JS_URL=""
          # personhog is not running here; an empty address takes the Django ORM fallbacks.
          export PERSONHOG_ADDR=""
          exec ./bin/start-backend

    - name: worker
      command: |
          export PATH="/opt/node/bin:$PWD/.venv/bin:$PATH"
          while IFS="=" read -r name value; do
              if [[ -n "$name" && "$name" != \#* && -z "${!name:-}" ]]; then
                  export "$name=$value"
              fi
          done < <(cat .env.development .env.services)
          export PERSONHOG_ADDR=""
          exec ./bin/start-celery worker

    - name: frontend
      command: |
          export PATH="/opt/node/bin:$PWD/.venv/bin:$PATH"
          exec ./bin/start-frontend
      environment:
          # Vite rejects the preview hostname otherwise.
          - name: VITE_ALLOWED_HOSTS
            value: localhost,.preview.niteshift.dev

    # One origin for the browser: Django, the Vite dev server, and framing headers the preview
    # panel accepts.
    - name: proxy
      port: 8010
      command: |
          exec caddy run --adapter caddyfile --config - <<'CADDY'
          {
              admin off
              auto_https off
              # Keep the preview edge's X-Forwarded-Proto, so Django knows the browser is on HTTPS.
              servers {
                  trusted_proxies static 0.0.0.0/0 ::/0
              }
          }
          :{$PORT} {
              # The Vite dev server owns its module graph; Django serves everything else.
              @vite path /@* /src/* /node_modules/*
              @vite_hmr header Sec-WebSocket-Protocol *vite-hmr*
              handle @vite_hmr {
                  reverse_proxy 127.0.0.1:8234
              }
              handle @vite {
                  reverse_proxy 127.0.0.1:8234
              }
            handle {
                reverse_proxy 127.0.0.1:8000 {
                    # Django 5.2 rejects hostnames with underscores per RFC 1034/1035;
                    # sanitize the preview hostname before it reaches the app.
                    header_up Host "_" "-"
                    header_up X-Forwarded-Host "_" "-"
                }
            }
              # Django sends X-Frame-Options: SAMEORIGIN, which blanks the preview panel.
              header {
                  -X-Frame-Options
                  Content-Security-Policy "frame-ancestors 'self' https://niteshift.dev https://*.niteshift.dev"
              }
          }
          CADDY
